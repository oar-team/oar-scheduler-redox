image: docker:latest

include:
  - template: Code-Quality.gitlab-ci.yml

stages:
  - test

test:
  stage: test
  image: rustlang/rust:latest
  script:
    - cargo build --verbose -p oar-scheduler-core
    - cargo test --verbose -p oar-scheduler-core
    - cargo tarpaulin --out Xml --cobertura --ignore-tests -p oar-scheduler-core
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

