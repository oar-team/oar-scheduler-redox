[workspace]
resolver = "3"
members = [
    "crates/oar-scheduler-core",
    "crates/oar-scheduler-bench",
    "crates/oar-scheduler-redox",
    "crates/oar-scheduler-hooks",
    "crates/oar-scheduler-db",
    "crates/oar-scheduler-meta",
]

[profile.release]
lto = "fat"
opt-level = 3
panic = "abort"
strip = "debuginfo"
